[project]
name = "house-prices"
version = "0.1.0"
description = "Ames House Prices - reproducible regression pipeline with OOF blending"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "scipy>=1.10",
  "lightgbm>=4.0", "xgboost>=2.0", "catboost>=1.2", "pyyaml>=6.0", "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
